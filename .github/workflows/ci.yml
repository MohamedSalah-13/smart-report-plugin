# Builds every module and runs every test on each push to master, each pull request and each release tag.
# JitPack builds the library straight from a tag, so this is the check that stands between a tag and its users.
# It builds with ./mvnw, the same Maven JitPack uses: with a newer Maven of its own, CI passed a tag (v2.7.0) that
# JitPack's Maven could not build.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux: what JitPack builds on. Windows: where the programs that use the library run and print.
        os: [ubuntu-latest, windows-latest]
        # 21: what the library is compiled for and what JitPack builds with. 25: the current LTS.
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # setup-java's own Maven cache is keyed on the pom files alone, and every release changes their version,
      # so each release run used to download everything again - and Maven Central answered 429 Too Many Requests.
      # restore-keys brings back the newest cache when the poms changed; the full key saves an updated one.
      # runner.os keeps the Linux and Windows caches apart. ~/.m2/wrapper holds the Maven that ./mvnw downloads.
      - name: Maven cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-java${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-java${{ matrix.java }}-

      # The preview window's tests open a real JavaFX window; on Linux xvfb gives them a display, and the Windows
      # runner has a desktop of its own. Without one they are skipped rather than failed, so the run still says
      # whether they ran.
      # Maven retries 429/503 three times 5 s apart by default; six tries 10 s, 20 s, ... apart ride out a rate limit.
      # bash on both systems, so the command and its -D flags read the same on Windows.
      - name: Build and test
        shell: bash
        run: >-
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} ./mvnw -B -ntp verify
          -Daether.connector.http.retryHandler.count=6
          -Daether.connector.http.retryHandler.interval=10000

      # Whether the preview window's tests ran or were skipped for want of a display, in the run's summary.
      - name: JavaFX preview tests
        if: always()
        shell: bash
        run: |
          report=smart-report-fx/target/surefire-reports/TEST-com.smart.report.fx.PdfPreviewTest.xml
          if [ -f "$report" ]; then
            summary=$(grep -o -m1 '<testsuite [^>]*>' "$report" | grep -o -E '(tests|skipped|failures|errors)="[0-9]+"' | tr '\n' ' ')
            echo "PdfPreviewTest on ${{ runner.os }}, Java ${{ matrix.java }}: $summary" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PdfPreviewTest on ${{ runner.os }}, Java ${{ matrix.java }}: no report" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The command JitPack runs on a tag (Linux, Java 21 from jitpack.yml), with the JITPACK variable it sets, so a
      # change that only breaks JitPack's build - a plugin its Maven cannot load, say - shows here before a tag is
      # pushed. Without clean, so the test reports above stay for the steps below.
      - name: JitPack's build
        if: runner.os == 'Linux' && matrix.java == '21'
        shell: bash
        env:
          JITPACK: 'true'
        run: >-
          ./mvnw -B -ntp install -DskipTests
          -Daether.connector.http.retryHandler.count=6
          -Daether.connector.http.retryHandler.interval=10000

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ runner.os }}-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 14
