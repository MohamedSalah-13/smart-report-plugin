# JasperReports reads every jasperreports_extension.properties on the classpath. This one adds Noto Naskh Arabic:
# - the family "Noto Naskh Arabic", for templates that name it (com/smart/report/jasper/fonts/fonts.xml);
# - Arabic letters for the default font "SansSerif", for templates that name no font (com.smart.report.jasper.ArabicFonts).
# A fat jar must append the files of all jars instead of keeping one of them
# (maven-shade-plugin: AppendingTransformer with resource jasperreports_extension.properties).
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.smartreport=com/smart/report/jasper/fonts/fonts.xml
net.sf.jasperreports.extension.registry.factory.smartreport.arabic=com.smart.report.jasper.ArabicFonts
